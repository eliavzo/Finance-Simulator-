name: Deploy web build to GitHub Pages

on:
  # Run on pushes to the development branch and main so the live demo tracks
  # whatever is newest, plus a manual trigger button.
  push:
    branches:
      - main
      - claude/alpha-carry-simulator-game-jmUav
  workflow_dispatch:

# Grant the token the permissions the Pages deploy action needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure GitHub Pages
        # enablement: true turns Pages on automatically (source = GitHub
        # Actions) so no manual repo-settings step is required.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Export static web build
        # EXPO_BASE_URL prefixes all asset paths so they resolve under the
        # project Pages subpath (https://<user>.github.io/<repo>/).
        env:
          EXPO_BASE_URL: /finance-simulator-
        run: npx expo export --platform web

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
